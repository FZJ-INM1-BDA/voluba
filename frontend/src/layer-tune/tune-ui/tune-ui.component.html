<form [formGroup]="tuneInput">
    <div class="section">
        <mat-form-field class="input">
            <mat-label>
                Translate X
            </mat-label>
            <input [step]="1e6" formControlName="translateX" type="number" matInput>
        </mat-form-field>
        <mat-form-field class="input">
            <mat-label>
                Translate Y
            </mat-label>
            <input [step]="1e6" formControlName="translateY" type="number" matInput>
        </mat-form-field>
        <mat-form-field class="input">
            <mat-label>
                Translate Z
            </mat-label>
            <input [step]="1e6" formControlName="translateZ" type="number" matInput>
        </mat-form-field>
    </div>

    <mat-divider></mat-divider>
    
    <mat-tab-group>
        <mat-tab label="Scale">
            <div class="section isotrope-header">
                <mat-slide-toggle formControlName="isotropic">
                    Isotropic
                </mat-slide-toggle>
            </div>
        
            <div class="section">
                <mat-form-field class="input">
                    <mat-label>
                        Scale X
                    </mat-label>
                    <input [step]="0.1" formControlName="scaleX" type="number" matInput>
                </mat-form-field>
                <mat-form-field class="input">
                    <mat-label>
                        Scale Y
                    </mat-label>
                    <input [step]="0.1" formControlName="scaleY" type="number" matInput>
                </mat-form-field>
                <mat-form-field class="input">
                    <mat-label>
                        Scale Z
                    </mat-label>
                    <input [step]="0.1" formControlName="scaleZ" type="number" matInput>
                </mat-form-field>
            </div>
        </mat-tab>

        <mat-tab label="Voxel Size">
            <ng-template [ngTemplateOutlet]="voxelSizeTmpl"></ng-template>
        </mat-tab>
    </mat-tab-group>

    <mat-divider></mat-divider>

    <div class="section rotation-container">
        <h4>
            Rotation (degrees)
        </h4>
        
        <div class="rotation-control-container">

            <div class="rotation-control-label">X</div>
            
            <mat-slider [min]="-180" [max]="180" [step]="1">
                <input matSliderThumb formControlName="rotX" #xRotSliderTh="matSliderThumb">
            </mat-slider>
            <div class="rotation-control-value">{{ xRotSliderTh.value }}</div>

            <div class="rotation-control-label">Y</div>
            <mat-slider  [min]="-90" [max]="90" [step]="1" >
                <input matSliderThumb formControlName="rotY" #yRotSliderTh="matSliderThumb">
            </mat-slider>
            <div class="rotation-control-value">{{ yRotSliderTh.value }}</div>

            <div class="rotation-control-label">Z</div>
            <mat-slider  [min]="-180" [max]="180" [step]="1" >
                <input matSliderThumb formControlName="rotZ" #zRotSliderTh="matSliderThumb">
            </mat-slider>
            <div class="rotation-control-value">{{ zRotSliderTh.value }}</div>
        </div>
    </div>

    <div class="section">
        <button mat-button (click)="rotate90('x')">
            Rotate 90 deg X
        </button>
        <button mat-button (click)="rotate90('y')">
            Rotate 90 deg Y
        </button>
        <button mat-button (click)="rotate90('z')">
            Rotate 90 deg Z
        </button>
    </div>

    <ng-template [ngIf]="view$ | async" let-view>

        <div class="section">
        
            <button mat-flat-button [color]="view.xFlipped ? 'primary' : 'default'" (click)="flip('x')">
                Flip X axis
            </button>
            <button mat-flat-button [color]="view.yFlipped ? 'primary' : 'default'" (click)="flip('y')">
                Flip Y axis
            </button>
            <button mat-flat-button [color]="view.zFlipped ? 'primary' : 'default'" (click)="flip('z')">
                Flip Z axis
            </button>
        </div>
    </ng-template>
</form>

<ng-template #voxelSizeTmpl>

    <form [formGroup]="voxelSpacingFormGroup">
    
        <div class="section isotrope-header">
    
            <mat-slide-toggle formControlName="isotropic">
                Isotropic
            </mat-slide-toggle>
        
            <mat-button-toggle-group name="unit" formControlName="unit">
                <mat-button-toggle *ngFor="let unit of availableUnits" [value]="unit">
                    {{ unit }}
                </mat-button-toggle>
            </mat-button-toggle-group>
        </div>
    
        <div class="section">
            
            <mat-form-field class="input">
                <mat-label>
                    X Voxel Spacing
                </mat-label>
                <input [min]="0" [step]="0.1" formControlName="valueX" type="number" matInput>
            </mat-form-field>
            <mat-form-field class="input">
                <mat-label>
                    Y Voxel Spacing
                </mat-label>
                <input [min]="0" [step]="0.1" formControlName="valueY" type="number" matInput>
            </mat-form-field>
            <mat-form-field class="input">
                <mat-label>
                    Z Voxel Spacing
                </mat-label>
                <input [min]="0" [step]="0.1" formControlName="valueZ" type="number" matInput>
            </mat-form-field>
        </div>
        
    </form>
    
</ng-template>
